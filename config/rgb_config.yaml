# RGB dataset-specific training configuration
# Inherits from base_config.yaml

# Dataset configuration
dataset:
  name: "rgb"
  train_path: "data/rgb/images/train"
  val_path: "data/rgb/images/valid"
  test_path: "data/rgb/images/test"
  label_path: "data/rgb/labels"
  classes: ["pole"]
  num_classes: 1

  # Data preparation settings
  cache_images: true
  single_cls: true # Single class detection

# Model customization for RGB data
model:
  name: "yolov12n" # Light model suitable for edge deployment
  input_size: 640

  # RGB-specific model tuning
  channels: 3 # Standard RGB channels

# Training adjustments for RGB data
training:
  batch_size: 16
  epochs: 100
  learning_rate: 0.001

  # Class weights (if needed for imbalance)
  class_weights: [1.0]

# RGB-specific augmentation adjustments
augmentation:
  # Full color-based augmentations for RGB
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # Weather augmentations specific to outdoor imagery
  weather_aug: true
  rain_probability: 0.2
  snow_probability: 0.3
  fog_probability: 0.2

  # Geometry augmentations
  scale: 0.5
  translate: 0.1
  fliplr: 0.5

# Evaluation specifications
evaluation:
  # Focus metrics for RGB evaluation
  metrics: ["precision", "recall", "mAP50", "mAP50-95"]

  # Visualization settings
  visualize_predictions: true
  max_visualizations: 100
