# LiDAR-specific training configuration
# Inherits from base_config.yaml

# Dataset configuration
dataset:
  name: "lidar"
  train_path: "/datasets/tdt4265/ad/open/Poles/lidar/combined_color/train"
  val_path: "/datasets/tdt4265/ad/open/Poles/lidar/combined_color/valid"
  test_path: "/datasets/tdt4265/ad/open/Poles/lidar/combined_color/test"
  label_path: "/datasets/tdt4265/ad/open/Poles/lidar/labels"
  classes: ["pole"]
  num_classes: 1

  # Data preparation settings
  cache_images: true
  single_cls: true # Single class detection

# Model customization for LiDAR data
model:
  name: "yolov12n" # Light model suitable for edge deployment
  # Changed from 640 to use rectangular format as mentioned in the paper
  input_width: 1024
  input_height: 128
  # Keep input_size for compatibility with code that might use it
  input_size: 640

  # LiDAR-specific model tuning
  # These channels correspond to different LiDAR modalities
  # Near-IR (blue), Signal (green), Reflectivity (red)
  channels: 3

# Training adjustments for LiDAR data
training:
  batch_size: 16
  epochs: 100
  learning_rate: 0.001

  # Class weights (if needed for imbalance)
  class_weights: [1.0]

# LiDAR-specific augmentation adjustments
augmentation:
  # Reduce color-based augmentations for LiDAR
  hsv_h: 0.01 # Lower color hue adjustment
  hsv_s: 0.5 # Lower saturation adjustment

  # Geometry augmentations still useful
  scale: 0.5
  translate: 0.1
  fliplr: 0.5

# Evaluation specifications
evaluation:
  # Focus metrics for LiDAR evaluation
  metrics: ["precision", "recall", "mAP50", "mAP50-95"]

  # Visualization settings
  visualize_predictions: true
  max_visualizations: 100
